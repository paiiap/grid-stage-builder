<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Grid Stage Builder sample stage preview</title>
  <desc id="desc">A sample tile-grid stage export with room colors, furniture names, gameplay path, spawn, base, and build slots.</desc>
  <defs>
    <pattern id="minorGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#cdbf9f" stroke-width="1"/>
    </pattern>
    <pattern id="majorGrid" width="160" height="160" patternUnits="userSpaceOnUse">
      <rect width="160" height="160" fill="url(#minorGrid)"/>
      <path d="M 160 0 L 0 0 0 160" fill="none" stroke="#917a55" stroke-width="2"/>
    </pattern>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#5f4a2f" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="#f5ead6"/>
  <rect x="28" y="28" width="1144" height="704" rx="22" fill="#fff8ea" stroke="#c8ad7b" stroke-width="3"/>

  <g font-family="Inter, Arial, sans-serif">
    <text x="64" y="82" font-size="36" font-weight="900" fill="#2f2924">Grid Stage Builder</text>
    <text x="64" y="116" font-size="18" font-weight="700" fill="#7f6b4e">Sample Stage Export - PNG Full</text>

    <g transform="translate(64 152)" filter="url(#softShadow)">
      <rect width="768" height="512" rx="10" fill="#d8c49a" stroke="#6a5538" stroke-width="4"/>
      <rect width="768" height="512" rx="10" fill="url(#majorGrid)" opacity="0.92"/>

      <rect x="0" y="0" width="768" height="320" fill="#d69f72" opacity="0.72"/>
      <rect x="0" y="320" width="448" height="192" fill="#d9b180" opacity="0.8"/>
      <rect x="448" y="320" width="320" height="192" fill="#7fb979" opacity="0.72"/>
      <rect x="448" y="0" width="320" height="160" fill="#8eb7d9" opacity="0.7"/>
      <rect x="448" y="160" width="320" height="160" fill="#d7bd74" opacity="0.72"/>

      <path d="M 16 272 H 176 V 176 H 352 V 272 H 576 V 208 H 736" fill="none" stroke="#f7e6bd" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 16 272 H 176 V 176 H 352 V 272 H 576 V 208 H 736" fill="none" stroke="#cf6947" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 14"/>

      <g stroke="#3b3128" stroke-width="2">
        <rect x="80" y="48" width="224" height="96" rx="8" fill="#6f91b7"/>
        <rect x="112" y="176" width="160" height="96" rx="7" fill="#8b6648"/>
        <rect x="336" y="56" width="64" height="64" rx="7" fill="#5d9658"/>
        <rect x="96" y="376" width="192" height="72" rx="7" fill="#59483a"/>
        <rect x="480" y="48" width="192" height="64" rx="7" fill="#9b7a52"/>
        <rect x="512" y="184" width="128" height="80" rx="7" fill="#9b7a52"/>
        <rect x="560" y="368" width="96" height="64" rx="32" fill="#5d9658"/>
      </g>

      <g font-size="18" font-weight="900" text-anchor="middle">
        <g>
          <rect x="136" y="78" width="112" height="36" rx="7" fill="#fffaf0" opacity="0.86" stroke="#59483a"/>
          <text x="192" y="102" fill="#2f2924">Blue Sofa</text>
        </g>
        <g>
          <rect x="128" y="206" width="128" height="36" rx="7" fill="#fffaf0" opacity="0.86" stroke="#59483a"/>
          <text x="192" y="230" fill="#2f2924">Coffee Table</text>
        </g>
        <g>
          <rect x="318" y="70" width="100" height="36" rx="7" fill="#fffaf0" opacity="0.86" stroke="#59483a"/>
          <text x="368" y="94" fill="#2f2924">Plant</text>
        </g>
        <g>
          <rect x="134" y="394" width="116" height="36" rx="7" fill="#fffaf0" opacity="0.86" stroke="#59483a"/>
          <text x="192" y="418" fill="#2f2924">TV Stand</text>
        </g>
        <g>
          <rect x="510" y="62" width="132" height="36" rx="7" fill="#fffaf0" opacity="0.86" stroke="#59483a"/>
          <text x="576" y="86" fill="#2f2924">Kitchen Counter</text>
        </g>
        <g>
          <rect x="512" y="206" width="128" height="36" rx="7" fill="#fffaf0" opacity="0.86" stroke="#59483a"/>
          <text x="576" y="230" fill="#2f2924">Dining Table</text>
        </g>
        <g>
          <rect x="534" y="382" width="148" height="36" rx="7" fill="#fffaf0" opacity="0.86" stroke="#59483a"/>
          <text x="608" y="406" fill="#2f2924">Potted Plant</text>
        </g>
      </g>

      <g font-size="18" font-weight="900" text-anchor="middle">
        <rect x="16" y="240" width="72" height="64" rx="12" fill="#c94f45" stroke="#7f2d28" stroke-width="3"/>
        <text x="52" y="279" fill="#fffaf0">S1</text>
        <rect x="704" y="176" width="56" height="64" rx="12" fill="#3276ba" stroke="#1c4775" stroke-width="3"/>
        <text x="732" y="215" fill="#fffaf0">B1</text>
        <rect x="384" y="352" width="64" height="64" rx="8" fill="none" stroke="#2f8f73" stroke-width="5" stroke-dasharray="10 8"/>
        <text x="416" y="391" fill="#2f8f73">Slot</text>
      </g>

      <g font-size="20" font-weight="900">
        <text x="24" y="32" fill="#8b4d2f">Living Room</text>
        <text x="468" y="32" fill="#2e5f86">Kitchen</text>
        <text x="468" y="192" fill="#806027">Dining Room</text>
        <text x="468" y="352" fill="#3e7143">Garden</text>
      </g>
    </g>

    <g transform="translate(872 152)">
      <rect width="264" height="512" rx="14" fill="#ffffff" stroke="#c8ad7b" stroke-width="2"/>
      <text x="24" y="48" font-size="22" font-weight="900" fill="#2f2924">Export Panel</text>
      <g font-size="18" font-weight="800" fill="#2f2924">
        <rect x="24" y="80" width="216" height="42" rx="8" fill="#f4e4c8" stroke="#c8ad7b"/>
        <text x="44" y="108">GameJSON</text>
        <rect x="24" y="138" width="216" height="42" rx="8" fill="#f4e4c8" stroke="#c8ad7b"/>
        <text x="44" y="166">Image Prompt</text>
        <rect x="24" y="196" width="216" height="42" rx="8" fill="#f4e4c8" stroke="#c8ad7b"/>
        <text x="44" y="224">PNG Full</text>
        <rect x="24" y="254" width="216" height="42" rx="8" fill="#f4e4c8" stroke="#c8ad7b"/>
        <text x="44" y="282">PNG Art</text>
        <rect x="24" y="312" width="216" height="42" rx="8" fill="#f4e4c8" stroke="#c8ad7b"/>
        <text x="44" y="340">PNG Game Points</text>
      </g>
      <text x="24" y="410" font-size="16" font-weight="700" fill="#6f604b">Furniture names are rendered</text>
      <text x="24" y="434" font-size="16" font-weight="700" fill="#6f604b">inside PNG Full and PNG Art.</text>
    </g>
  </g>
</svg>
